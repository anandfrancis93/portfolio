about:
  eyebrow: About
  heading: Support is where you learn how systems actually fail
  paragraphs:
    - >-
      I have spent eleven years on the other end of the phone and the ticket queue. AT&T,
      American Express, Cvent, Google, Dell, and since 2023 Brigham Young University – Idaho.
      The through-line has always been the same: someone’s system is not doing what they
      expect, and my job is to find out why.
    - >-
      That work taught me the parts of security a syllabus does not cover — how permissions
      actually get granted, why a fleet drifts out of compliance, what an escalation looks
      like while nobody yet knows the cause. At BYU-Idaho I managed Windows and macOS fleets
      with Active Directory, SCCM and Jamf, and coordinated 802.1X enrollment across student
      and employee VLANs.
    - >-
      Right now I work in AI enablement: helping faculty use these tools sensibly, and
      building an internal agent with Claude Code that answers team questions across
      scattered documentation. I am finishing a B.S. in Cybersecurity in July 2028 and looking
      for an internship where I can do security work alongside people who know more than I do.
  education:
    eyebrow: Education
    entries:
      - title: B.S. Cybersecurity
        institution: Brigham Young University – Idaho
        detail: expected July 2028
  certifications:
    eyebrow: Certifications
