# Claude Code's subprocess scrub (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB) runs every shell command
# Claude issues inside a bubblewrap sandbox, and refuses to start without it. The Ubuntu runner
# image does not carry bubblewrap, and Ubuntu 24.04's AppArmor refuses unprivileged user
# namespaces until a profile allows them, so this installs the package, adds the profile the
# Claude Code sandboxing documentation gives when the kernel is restricted, and proves a sandbox
# opens before the Claude step runs. Shared by the review and mention workflows.
name: Bubblewrap
description: Install bubblewrap for Claude Code's subprocess scrub and prove a sandbox opens
runs:
  using: composite
  steps:
    - name: Install bubblewrap
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends bubblewrap socat
        restricted=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "absent")
        echo "kernel.apparmor_restrict_unprivileged_userns: $restricted"
        if [ "$restricted" = "1" ]; then
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
        abi <abi/4.0>,
        include <tunables/global>

        profile bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
          include if exists <local/bwrap>
        }
        PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
        fi
        bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid -- /bin/true
        echo "$(bwrap --version) opens a sandbox on this runner"
