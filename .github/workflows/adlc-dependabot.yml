# ADLC tier for Dependabot PRs. The ADLC manages this file: `adlc.py sync` writes it, and the drift check fails if it changes.
# Uses pull_request_target because Dependabot's pull_request token is read-only.
# statuses: write lets it post the commit status t3-approval, which passes: no Dependabot PR is T3.
# The called workflow never checks out or runs the PR's code.
name: ADLC Dependabot tier

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  statuses: write

jobs:
  tier:
    uses: anandfrancis93/ADLC/.github/workflows/adlc-dependabot.yml@v0.8.0
