# ADLC checks on reviews and labels. The ADLC manages this file: `adlc.py sync` writes it, and the drift check fails if it changes.
# Re-checks t3-approval after a review or a label change, such as the owner adding adlc:t3-approved,
# and counts agent review rounds. Keep the job id "adlc", as in adlc.yml.
# statuses: write lets the tier job post the commit status t3-approval. The latest status counts, so nothing re-runs.
# Repo variables: ADLC_OWNER (GitHub login that approves T3), ADLC_REVIEWERS
# (comma-separated logins of agent reviewers, e.g. "claude[bot]").
name: ADLC review

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [labeled, unlabeled]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: write

jobs:
  adlc:
    uses: anandfrancis93/ADLC/.github/workflows/adlc-review.yml@v0.8.0
    with:
      owner: ${{ vars.ADLC_OWNER }}
      reviewers: ${{ vars.ADLC_REVIEWERS }}
