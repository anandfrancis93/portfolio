name: review
run-name: "three review passes on PR #${{ github.event.pull_request.number }}"

# Every pull request gets the three REVIEW.md passes from Claude Code, posted as one review on
# the pull request. It is not a required check: `ci` is the only one the ruleset requires, and a
# model's judgement never decides a merge. It is read-only: `ci` runs the checks, and REVIEW.md
# already leaves what CI enforces to CI. A push during a review restarts it. Drafts and forks
# are skipped. The action is pinned to a commit; the tag it carried on the day is in the comment.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# These bound GITHUB_TOKEN. The token the action mints for Claude carries contents, pull
# requests and issues write regardless, so the tool list below is the real boundary.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The scrub below keeps the tokens the action puts in Claude's environment out of the shell
      # commands Claude runs. It needs bubblewrap, which the runner image does not carry, and Claude
      # Code refuses to start without it (the first automatic review, run 33818134286), so the
      # composite action installs it and proves a sandbox opens.
      - uses: ./.github/actions/bubblewrap
      - uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1, tagged 2 September 2026
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automatic review of this repository. The pull request's branch is checked out.
            Read REVIEW.md first. Then read the intent, spec and plan the pull request names under
            docs/sdlc/ (the description says which), and the pull request description. Read the diff with
            `gh pr diff ${{ github.event.pull_request.number }}` and the changed files in the checkout.

            Run the three passes REVIEW.md defines, over the diff only: 1 Bugs; 2 Accessibility,
            performance and security; 3 Compliance with the spec, the plan and the design system. Apply
            REVIEW.md's definitions of Important and Nit, its five-nit cap, and its list of what not to
            report. Verify a claim against the repository before you make it.

            Post exactly one review, with the report on standard input through a single-quoted heredoc,
            so backticks and quotes in it are never read by the shell:
            gh pr review ${{ github.event.pull_request.number }} --comment --body-file - <<'REVIEW'
            <the report>
            REVIEW
            The report: a heading "Automatic review", then per pass the findings ranked Important first
            and Nit after, each with file and line, then one closing line per pass in the form
            "Pass N (<name>): X Important, Y Nit". If a pass finds nothing, say so in its closing line.
            Never approve, never request changes, never merge, never edit a file, never run the checks
            (ci runs them), and post nothing else.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review ${{ github.event.pull_request.number }} --comment:*),Bash(git diff:*)"
      # The action refuses to run from a workflow file whose content differs from main's, a
      # safeguard against a pull request rewriting the workflow that reviews it, and says so with a
      # warning and a green step (PR #25, run 33908596875). So the job ends by asking GitHub whether
      # a review by the app exists on the head commit. When none does, one review comment on the
      # pull request names the commit and the reason, posted once, and the job fails, so a green
      # `review` means a review was posted. It is not a required check, so the red blocks nothing;
      # the pre-flight reports stand in. A review rather than an issue comment: the deploy
      # workflow's preview step posts its URL with `gh pr comment --edit-last`, which edits this
      # bot's last issue comment whichever it is, and on PR #27 it overwrote the record within a
      # minute (run 33952763844). A review's commit_id is the head when it was posted, so one
      # landing in the seconds between a push and the cancellation of the run that wrote it counts
      # for the new head; rare, and the pre-flight reads the diff either way. One page of a hundred
      # reviews is more than any pull request here has carried. `pull-requests: write` covers the
      # read and the post.
      - name: Record whether a review was posted
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          reviews=$(gh api "repos/$REPO/pulls/$NUMBER/reviews?per_page=100")
          posted=$(echo "$reviews" | jq "[.[] | select(.user.type == \"Bot\" and (.user.login | startswith(\"claude\")) and .commit_id == \"$SHA\")] | length")
          if [ "$posted" -gt 0 ]; then
            echo "Automatic review posted on $SHA."
            exit 0
          fi
          # 0: the file matches main's; 1: it differs; anything else: the checkout cannot say.
          git diff --quiet origin/main -- .github/workflows/review.yml 2>/dev/null && same=0 || same=$?
          case "$same" in
            0) reason="the action posted nothing; this run's log says why" ;;
            1) reason="this pull request changes review.yml, and the action refuses to run from a workflow file that differs from main's" ;;
            *) reason="the checkout could not compare review.yml with main's; this run's log says why" ;;
          esac
          marker="Automatic review did not run on $SHA"
          body="$marker: $reason. The pre-flight reports REVIEW.md asks for stand in; check they are on this pull request before merging."
          existing=$(echo "$reviews" | jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))] | length")
          [ "$existing" -gt 0 ] || gh pr review "$NUMBER" --comment --body "$body"
          echo "::error::$body"
          exit 1
