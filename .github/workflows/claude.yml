name: claude

# The GitHub half of the review loop: a comment or a review on a pull request that mentions
# @claude runs Claude Code on that branch, with the checks available and nothing that deploys.
# Only a commenter with write access triggers it (the action's default), so on this repository
# that is the owner; a stranger's comment does nothing. The job carries no Cloudflare secret, the
# project's own hooks load inside the runner, and the tools are limited to what a fix needs. The
# action is pinned to a commit; the tag it carried on the day is in the comment beside it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    name: respond
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium, so `pnpm build` and `pnpm test` can run when a fix needs them.
      - run: pnpm exec playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1, tagged 2 September 2026
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm check),Bash(pnpm lint),Bash(pnpm format),Bash(pnpm build),Bash(pnpm test),Bash(pnpm test:*),Bash(node scripts/check-*),Bash(node scripts/eval-skills.mjs),Bash(git *),Bash(gh pr *)"
            --disallowedTools "Bash(node scripts/deploy.mjs*),Bash(node scripts/rollback.mjs*),Bash(pnpm run deploy:*),Bash(pnpm run rollback:*),Bash(wrangler*),Bash(pnpm exec wrangler*)"
            --append-system-prompt "You are answering a pull request comment on anandfrancis.com. Read CLAUDE.md and REVIEW.md before changing anything, follow the plan the pull request names, run pnpm check and pnpm lint before you push, push to the pull request's own branch, and never merge or deploy."
