name: deploy

# Every pull request and every push to main deploys the build to the preview Worker (public on
# workers.dev, marked noindex), comments the URL on the pull request, and runs the headers spec
# against it. Production deploys only by hand, through the release gate: a workflow_dispatch on
# main, for a commit whose `ci` check is green, with the approval reference, which the deploy
# script requires as RELEASE_APPROVAL. Both jobs skip, with a notice, until the Cloudflare
# secrets exist. One preview Worker serves every branch, so the last deploy wins.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_approval:
        description: "Approval reference for a production release (the ticket or the approving message)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    name: secrets present
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; the deploy is skipped."
          fi

  preview:
    name: preview
    if: github.event_name != 'workflow_dispatch' && needs.secrets.outputs.present == 'true'
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - id: deploy
        run: pnpm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          BODY: "Preview: ${{ steps.deploy.outputs.url }} (commit ${{ github.sha }})"
        run: |
          gh pr comment "$NUMBER" --edit-last --body "$BODY" || gh pr comment "$NUMBER" --body "$BODY"
      - name: Headers spec against the deployed preview
        run: pnpm test:headers
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}

  production:
    name: production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.secrets.outputs.present == 'true'
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a green ci check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "ci")] | sort_by(.completed_at) | last | .conclusion // "none"')
          echo "ci for $SHA: $conclusion"
          [ "$conclusion" = "success" ] || { echo "::error::ci is not green for $SHA; refusing to deploy production."; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm run deploy:production
        env:
          RELEASE_APPROVAL: ${{ inputs.release_approval }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A custom domain's record and certificate take a minute or so to exist after the deploy,
      # and a resolver that looked the name up too early caches the negative answer for longer
      # than this job lasts. So the check asks Cloudflare's own DNS over HTTPS for the apex
      # address, polling for up to five minutes, and then speaks to that address directly.
      - name: Smoke check
        run: |
          set -e
          host="anandfrancis.com"
          ip=""
          for attempt in $(seq 1 30); do
            ip=$(curl -sS -H 'accept: application/dns-json' \
              "https://cloudflare-dns.com/dns-query?name=$host&type=A" \
              | jq -r '[.Answer[]? | select(.type == 1) | .data] | first // empty')
            [ -n "$ip" ] && break
            echo "attempt $attempt: no A record for $host yet"
            sleep 10
          done
          [ -n "$ip" ] || { echo "::error::$host has no A record after five minutes."; exit 1; }
          echo "$host resolves to $ip"
          site="https://$host"
          probe() { curl -sS -o /dev/null -w '%{http_code}' --resolve "$host:443:$ip" "$site$1"; }
          code=""
          for attempt in $(seq 1 30); do
            code=$(probe / || true)
            [ "$code" = "200" ] && break
            echo "attempt $attempt: / returned ${code:-no response}"
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::/ returned $code"; exit 1; }
          code=$(probe /resume); [ "$code" = "200" ] || { echo "::error::/resume returned $code"; exit 1; }
          code=$(probe /nope); [ "$code" = "404" ] || { echo "::error::/nope returned $code"; exit 1; }
          curl -sSI --resolve "$host:443:$ip" "$site/resume" | grep -i "content-type: application/pdf"
          curl -sSI --resolve "$host:443:$ip" "$site/" | grep -i "content-security-policy: default-src 'none'"
