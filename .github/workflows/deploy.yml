name: deploy
run-name: deploy ${{ inputs.action || 'preview' }} on ${{ github.head_ref || github.ref_name }}

# Every pull request and every push to main deploys the build to the preview Worker (public on
# workers.dev, marked noindex), comments the URL on the pull request, and runs the headers spec
# against it. Production changes only by hand, through the release gate: a workflow_dispatch on
# main whose action is `release` or `rollback`, for a commit whose `ci` check is green, with the
# approval reference, which the scripts require as RELEASE_APPROVAL, and through the `production`
# environment, whose required reviewer approves the run in GitHub before it starts. The
# environment holds the production token; the repository secret is the preview token. A third
# action, `rollback-preview`, rolls the preview Worker back with no gate. Both production jobs end
# with the same smoke check, so a rollback is proven the way a release is. Every job skips, with
# a notice, until the Cloudflare secrets exist. One preview Worker serves every branch, so the
# last deploy wins.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "release deploys main to production; rollback rolls production back; rollback-preview rolls the preview Worker back"
        required: true
        type: choice
        options: [release, rollback, rollback-preview]
        default: release
      release_approval:
        description: "Approval reference for release and rollback (the ticket or the approving message; at most 120 characters)"
        required: false
        type: string
      version_id:
        description: "Version to roll back to, the full 36-character id wrangler lists; empty means the version before the current one"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PREVIEW_HOST: https://anandfrancis-com-preview.anand-francis93.workers.dev

jobs:
  secrets:
    name: secrets present
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; the deploy is skipped."
          fi

  preview:
    name: preview
    if: github.event_name != 'workflow_dispatch' && needs.secrets.outputs.present == 'true'
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - id: deploy
        run: pnpm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          BODY: "Preview: ${{ steps.deploy.outputs.url }} (commit ${{ github.sha }})"
        run: |
          gh pr comment "$NUMBER" --edit-last --body "$BODY" || gh pr comment "$NUMBER" --body "$BODY"
      - name: Headers spec against the deployed preview
        run: pnpm test:headers
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}

  production:
    name: production
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'release' && github.ref == 'refs/heads/main' && needs.secrets.outputs.present == 'true'
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://anandfrancis.com
    steps:
      - name: Require an approval reference
        if: inputs.release_approval == ''
        run: |
          echo "::error::release_approval is empty; it is the record of why this release happens."
          exit 1
      - name: Require a green ci check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "ci")] | sort_by(.completed_at) | last | .conclusion // "none"')
          echo "ci for $SHA: $conclusion"
          [ "$conclusion" = "success" ] || { echo "::error::ci is not green for $SHA; refusing to deploy production."; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm run deploy:production
        env:
          RELEASE_APPROVAL: ${{ inputs.release_approval }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: ./.github/actions/smoke-check

  rollback:
    name: rollback
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && github.ref == 'refs/heads/main' && needs.secrets.outputs.present == 'true'
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://anandfrancis.com
    steps:
      - name: Require an approval reference
        if: inputs.release_approval == ''
        run: |
          echo "::error::release_approval is empty; it is the record of why this rollback happens."
          exit 1
      - name: Require a green ci check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "ci")] | sort_by(.completed_at) | last | .conclusion // "none"')
          echo "ci for $SHA: $conclusion"
          [ "$conclusion" = "success" ] || { echo "::error::ci is not green for $SHA; refusing to roll production back from it."; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: rollback
        run: pnpm run rollback:production ${VERSION_ID:+--version "$VERSION_ID"}
        env:
          VERSION_ID: ${{ inputs.version_id }}
          RELEASE_APPROVAL: ${{ inputs.release_approval }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: echo "::notice::production is on version ${{ steps.rollback.outputs.version }}"
      - uses: ./.github/actions/smoke-check

  rollback-preview:
    name: rollback-preview
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback-preview' && needs.secrets.outputs.present == 'true'
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: rollback
        run: pnpm run rollback:preview ${VERSION_ID:+--version "$VERSION_ID"}
        env:
          VERSION_ID: ${{ inputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: echo "::notice::the preview is on version ${{ steps.rollback.outputs.version }}"
      - name: Headers spec against the rolled-back preview
        run: pnpm test:headers
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_HOST }}
