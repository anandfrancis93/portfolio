name: diag-claude

# Throwaway diagnostic (never merged): runs Claude Code directly on the runner with the OAuth
# token the two Claude workflows use, once with the subprocess scrub off and once on, and
# prints only the result fields, so the error the action hides becomes visible.

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    name: diag
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bubblewrap
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install Claude Code 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259
      - name: Probe with the scrub off
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "0"
        run: |
          set +e
          claude -p "Reply with the single word ok." --output-format json --max-turns 1 --tools "" --strict-mcp-config > /tmp/off.json 2> /tmp/off.err
          echo "exit: $?"
          echo "stderr (first 20 lines):"; head -20 /tmp/off.err
          echo "result fields:"; jq '{type, subtype, is_error, num_turns, result, errors, total_cost_usd}' /tmp/off.json 2>/dev/null || head -c 2000 /tmp/off.json
      - name: Probe with the scrub on
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        run: |
          set +e
          claude -p "Reply with the single word ok." --output-format json --max-turns 1 --tools "" --strict-mcp-config > /tmp/on.json 2> /tmp/on.err
          echo "exit: $?"
          echo "stderr (first 20 lines):"; head -20 /tmp/on.err
          echo "result fields:"; jq '{type, subtype, is_error, num_turns, result, errors, total_cost_usd}' /tmp/on.json 2>/dev/null || head -c 2000 /tmp/on.json
