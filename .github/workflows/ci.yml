name: ci
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('verify PR #{0} on {1}', github.event.pull_request.number, github.head_ref)
  || format('verify {0}', github.ref_name) }}

on:
  pull_request:
  push:
    branches: [main]

# The token can read the repository and nothing else; install scripts of dependencies run here.
permissions:
  contents: read

env:
  # `pnpm test` starts the preview through `wrangler dev`. Beside `send_metrics` in
  # wrangler.jsonc, which every command reads: wrangler dispatches a few autoconfig events
  # before it has read a project's configuration, and only the environment answers for those.
  WRANGLER_SEND_METRICS: "false"

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish so every merge commit has a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from packageManager in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium renders the résumé PDF and the social card in the build and runs the tests;
      # the browser is cached by Playwright version, the OS libraries are installed every run.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The definition of done: check, lint, build, html, test, lighthouse, audit.
      - run: pnpm verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
            dist/anand-francis-resume.pdf
            dist/og.png
          if-no-files-found: ignore
          # .lighthouseci is a hidden directory, which the action skips unless told otherwise.
          include-hidden-files: true
          retention-days: 14

  # The sign of a stopped watch (spec 003, section 6): the newest completed `watch` run must have
  # passed within three hours, or this job is red on the pull request. Not a required check, so
  # it never blocks a merge; a red mark that stays until the watch runs and passes again, with
  # the remedy in its log. Expected red on a branch pushed before the watch has run since the
  # hourly cron existed, and for up to three hours after a Monday failure.
  heartbeat:
    name: watch heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The watch's runs, and nothing else.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # No install: the script has no dependencies.
      - run: node scripts/check-heartbeat.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
